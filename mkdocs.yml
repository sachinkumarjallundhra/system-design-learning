site_name: System Design Learning
site_url: https://sachinkumarjallundhra.github.io/system-design-learning/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Patterns:
      - Scaling Writes: patterns/scaling-writes.md
  - Systems:
      - Instagram: systems/instagram.md
      - YouTube: systems/youtube.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - codehilite
  - pymdownx.superfences
